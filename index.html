:root{--sangre:#C73A4A;--mostaza:#B78627;--musgo:#708152;--cobre:#3E7C88;--amatista:#785B9D;--gris:#8A8A8A;--hueso:#FCF8F0;--oled:#000000}*{box-sizing:border-box;margin:0;padding:0}
body[data-mode="oled"]{--bg:var(--oled);--fg:var(--hueso);--fbg:var(--hueso);--ffg:var(--oled);--cc:var(--oled);--line:rgba(252,248,240,.16);--pill:rgba(0,0,0,.06)}
body[data-mode="hueso"]{--bg:var(--hueso);--fg:var(--oled);--fbg:var(--oled);--ffg:var(--hueso);--cc:var(--hueso);--line:rgba(0,0,0,.16);--pill:rgba(252,248,240,.09)}
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:'Newsreader';transition:background .38s ease,color .38s ease}
main{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:5vh 5vw}
h1,h2,.brand{font-family:'Fraunces';font-weight:450}
footer{height:52px;background:var(--fbg);color:var(--ffg);display:flex;justify-content:space-between;align-items:center;padding:0 24px;transition:background .38s ease,color .38s ease}
.footer-left,.footer-right{display:flex;align-items:center;gap:8px}
.glyph-item{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;background:var(--pill);color:var(--ffg);text-decoration:none;font-family:'Newsreader';font-size:13px;border:1px solid transparent;cursor:pointer;transition:all .24s ease}
.glyph-item .label{max-width:0;overflow:hidden;opacity:0;white-space:nowrap;transition:all .25s ease}
.glyph-item:hover{border-color:var(--mostaza);transform:translateY(-1px)}
.glyph-item:hover .label{max-width:110px;opacity:1;margin-left:3px}
svg.fig{width:16px;height:16px;flex-shrink:0}
html,body{height:100dvh;max-height:100dvh;overflow:hidden}body[data-mode="oled"]{--shadow-col:var(--amatista)}body[data-mode="hueso"]{--shadow-col:var(--fbg)}main{height:calc(100dvh - 52px);flex:none;position:relative;overflow:hidden;padding:18px 28px}.right-head{position:relative;z-index:2;text-align:right;pointer-events:none}.inline-astro{width:15px;height:15px;vertical-align:-3px;display:inline-block}#astro-lienzo,#sky-readout{transition:opacity .4s ease}#astro-lienzo.hidden,#sky-readout.hidden{opacity:0;pointer-events:none}#astro-lienzo{position:absolute;inset:0;width:100%;height:100%;z-index:1}#astro-lienzo{touch-action:none;user-select:none}.sky-pt{cursor:grab}.sky-pt:active{cursor:grabbing}.sky-pt text{font-family:'Newsreader';fill:var(--fg)}.sky-tech{opacity:0;pointer-events:none;transition:opacity .24s ease}.sky-pt:hover .sky-tech,.sky-pt.sel .sky-tech{opacity:1}.sky-pt circle.halo{opacity:0;transition:opacity .2s}.sky-pt:hover circle.halo,.sky-pt.sel circle.halo{opacity:.18}#clock.scrub{border-color:var(--mostaza)}#tool-btn.active{border-color:var(--mostaza)}.glyph-item .label{transition:max-width .32s cubic-bezier(.22,1,.36,1) .45s,opacity .28s ease .45s,margin .28s ease .45s}.glyph-item:hover .label,.glyph-item:focus-visible .label{transition-delay:0s}.pop-wrap{position:relative;display:inline-flex}.pop-card{position:absolute;bottom:calc(100% + 10px);left:0;width:250px;background:var(--fbg);color:var(--ffg);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(6px);transition:opacity .25s ease .45s,transform .25s ease .45s,visibility 0s linear .45s;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:50}.help-card,.tool-card,.soc-card{width:215px}.soc-row{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;background:var(--pill);color:var(--ffg);text-decoration:none;font-size:13px;border:1px solid transparent;transition:border-color .2s}.soc-row:hover{border-color:var(--mostaza)}.pop-card.right-card{left:auto;right:0}.pop-card::after{content:'';position:absolute;left:0;right:0;bottom:-18px;height:18px}.pop-wrap.open .pop-card{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);transition-delay:0s}@media(hover:hover)and (pointer:fine){.pop-wrap:not(.no-pop):hover .pop-card{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);transition-delay:0s}.right-pop:hover .phase-left,.footer-right:hover .phase-left{max-width:220px;opacity:.92;transition-delay:0s}}.pop-title{font-family:'Fraunces';font-size:14px;text-align:right;border-bottom:1px solid var(--line);padding-bottom:5px}.pop-row{display:flex;gap:6px;align-items:center}.pop-foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}.pop-card input{width:100%;background:transparent;border:1px solid var(--line);color:var(--ffg);font-family:'Newsreader';font-size:12.5px;padding:5px 9px;border-radius:7px;outline:none}.pop-card input:focus{border-color:var(--cobre)}.av-pick{background:var(--pill);border:1px solid var(--line);color:var(--ffg);font-family:'Fraunces';font-size:12px;padding:4px 9px;border-radius:7px;cursor:pointer}.footer-right{cursor:pointer;display:inline-flex;align-items:center;gap:10px;user-select:none}.footer-right svg.fig{width:23px;height:23px}.footer-sun{width:22px;height:22px;border-radius:50%;box-shadow:inset 7px 0 0 0 var(--amatista);flex-shrink:0}@media(max-width:680px){main{padding:12px 14px;height:calc(100dvh - 46px)}footer{height:46px;padding:0 10px}.footer-left,.footer-right{gap:4px}.glyph-item{height:28px;padding:0 7px;font-size:11.5px;gap:4px}.glyph-item .label,.phase-left{display:none}.footer-right{font-size:12.5px;letter-spacing:.05em;gap:6px}.pop-card,.help-card,.tool-card{width:min(240px,calc(100vw - 20px))}}</style></head><body data-mode="oled">

const ang=Astro&&Astro.MoonPhase?Astro.MoonPhase(d):(((lonOf('Moon',d).lon-lonOf('Sun',d).lon)%360+360)%360),dx=((ang<=180?1:-1)*Math.max(2.2,(1-Math.cos(ang*Math.PI/180))*11)).toFixed(1);
document.querySelector('.footer-sun').style.boxShadow=`inset ${dx}px 0 0 0 var(--amatista)`;};
document.getElementById('clock').onclick=()=>{if(timeOff!==0||vOff!==0){timeOff=0;vOff=0;selBody=null;drawSky();tick();}};
drawSky();tick();setInterval(tick,1000);setInterval(drawSky,30000);
const pw=document.getElementById('profile-wrap'),openOnly=w=>{document.querySelectorAll('.pop-wrap.open').forEach(x=>{if(x!==w)x.classList.remove('open');});w.classList.toggle('open');};
pw.onmouseleave=()=>pw.classList.remove('no-pop');
document.getElementById('brand-toggle').onclick=e=>{e.stopPropagation();document.body.dataset.mode=document.body.dataset.mode==='oled'?'hueso':'oled';pw.classList.remove('open');pw.classList.add('no-pop');};
['soc-btn','tool-btn','help-btn'].forEach(id=>{document.getElementById(id).onclick=e=>{e.stopPropagation();openOnly(document.getElementById(id).parentElement);};});
document.querySelectorAll('.pop-card').forEach(c=>c.onclick=e=>e.stopPropagation());
document.addEventListener('click',e=>{document.querySelectorAll('.pop-wrap.open').forEach(w=>{if(!w.contains(e.target))w.classList.remove('open');});});
const AVS=[['•','var(--sangre)'],['－','var(--mostaza)'],['▲','var(--musgo)'],['■','var(--cobre)'],['●','var(--amatista)']];
const applyTools=()=>{const sc=Math.min(200,Math.max(50,st.gscale||100)),zsc=Math.min(200,Math.max(50,st.zscale||100)),on=st.astro!==false,inr=st.inertia!==false,ron=!!st.refOn;
document.getElementById('gsz-val').textContent=sc+'%';document.getElementById('gsz-range').value=sc;
document.getElementById('zsz-val').textContent=zsc+'%';document.getElementById('zsz-range').value=zsc;
document.getElementById('inp-refdate').value=st.refDate||'';
document.getElementById('astro-lienzo').classList.toggle('hidden',!on);document.getElementById('sky-readout').classList.toggle('hidden',!on);
document.getElementById('tool-btn').classList.toggle('active',on);document.getElementById('astro-toggle').textContent=on?'On':'Off';
document.getElementById('inertia-toggle').textContent=inr?'On':'Off';if(!inr)vOff=0;
document.getElementById('ref-toggle').textContent=ron?'On':'Off';
localStorage.setItem('pscndn_os_v2',JSON.stringify(st));drawSky();};
document.getElementById('astro-toggle').onclick=e=>{e.stopPropagation();st.astro=st.astro===false?true:false;applyTools();};
document.getElementById('inertia-toggle').onclick=e=>{e.stopPropagation();st.inertia=st.inertia===false?true:false;applyTools();};
document.getElementById('ref-toggle').onclick=e=>{e.stopPropagation();st.refOn=!st.refOn;if(st.refOn&&!st.refDate)st.refDate=new Date().toISOString().slice(0,10);applyTools();};
document.getElementById('inp-refdate').oninput=document.getElementById('inp-refdate').onchange=e=>{st.refDate=e.target.value;st.refOn=!!st.refDate;applyTools();};
document.getElementById('gsz-range').oninput=document.getElementById('gsz-range').onchange=e=>{st.gscale=+e.target.value;applyTools();};
document.getElementById('gsz-dec').onclick=e=>{e.stopPropagation();st.gscale=Math.max(50,(st.gscale||100)-10);applyTools();};
document.getElementById('gsz-inc').onclick=e=>{e.stopPropagation();st.gscale=Math.min(200,(st.gscale||100)+10);applyTools();};
document.getElementById('gsz-val').onclick=e=>{e.stopPropagation();st.gscale=100;applyTools();};
document.getElementById('zsz-range').oninput=document.getElementById('zsz-range').onchange=e=>{st.zscale=+e.target.value;applyTools();};
document.getElementById('zsz-dec').onclick=e=>{e.stopPropagation();st.zscale=Math.max(50,(st.zscale||100)-10);applyTools();};
document.getElementById('zsz-inc').onclick=e=>{e.stopPropagation();st.zscale=Math.min(200,(st.zscale||100)+10);applyTools();};
document.getElementById('zsz-val').onclick=e=>{e.stopPropagation();st.zscale=100;applyTools();};
const normUrl=(v,base)=>!v?'':(v.startsWith('http')?v:base+v.replace(/^@/,''));
function syncUI(){const av=AVS[st.av||0];document.getElementById('av-cycle').textContent=av[0];document.getElementById('av-cycle').style.color=av[1];document.getElementById('os-title').textContent=st.name?(st.name+' · PSICOANDINO'):'PSICOANDINO';
[['yt','https://youtube.com/@','YouTube'],['li','https://linkedin.com/in/','LinkedIn'],['x','https://x.com/','X'],['ig','https://instagram.com/','Instagram']].forEach(([k,b,n])=>{const v=(st[k]||'').trim(),a=document.getElementById('soc-'+k),l=document.getElementById('lbl-'+k);if(v){a.href=normUrl(v,b);a.target='_blank';l.textContent=v.replace(/^https?:\/\/(www\.)?/,'');}else{a.href='#profile';a.removeAttribute('target');l.textContent='Set '+n;}});}
['name','yt','li','x','ig'].forEach(k=>{const el=document.getElementById('inp-'+k);el.value=st[k]||'';el.oninput=()=>{st[k]=el.value;localStorage.setItem('pscndn_os_v2',JSON.stringify(st));syncUI();};});
document.getElementById('av-cycle').onclick=()=>{st.av=((st.av||0)+1)%AVS.length;localStorage.setItem('pscndn_os_v2',JSON.stringify(st));syncUI();};
document.getElementById('prof-clear').onclick=()=>{st={};['name','yt','li','x','ig'].forEach(k=>document.getElementById('inp-'+k).value='');localStorage.removeItem('pscndn_os_v2');syncUI();};
document.querySelectorAll('.soc').forEach(a=>a.onclick=e=>{if(a.getAttribute('href')==='#profile'){e.preventDefault();e.stopPropagation();pw.classList.remove('no-pop');openOnly(pw);}});
syncUI();applyTools();</script></body></html>
